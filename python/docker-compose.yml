services:
  python:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    depends_on:
      - mysql
    environment:
      - APP_ENV=local

  mysql:
    image: mysql:8.4                  # 8.0 は 2026年4月 EOL のため 8.4 LTS を使用
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ses_matching
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
