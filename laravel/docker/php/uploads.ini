; アップロード上限。アプリの CSV 上限（CsvImportRequest::MAX_FILE_SIZE_KB = 5MB）より
; 大きくしておかないと、5MB 未満のファイルでも PHP 既定（upload_max_filesize=2M）で
; 先に弾かれ「アップロードに失敗しました」という分かりにくいエラーになる。
; アプリ側（クライアントの事前ガード＋Laravel の max:5120）を実効的な上限にするため、
; PHP 側は 5MB に余裕を持たせた値にする（post_max_size >= upload_max_filesize を維持）。
upload_max_filesize = 8M
post_max_size = 10M
