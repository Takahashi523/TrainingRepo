services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "5173:5173"                   # Vite 開発サーバー
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    environment:
      - APP_ENV=local

  mysql:
    image: mysql:8.4                  # 8.0 は 2026年4月 EOL のため 8.4 LTS を使用
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ses_matching
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
