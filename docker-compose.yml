services:
  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "5173:5173"                   # Vite 開発サーバー
    volumes:
      - ./laravel:/var/www
    depends_on:
      - mysql
    environment:
      - APP_ENV=local

  python:
    build:
      context: ./python
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    volumes:
      - ./python:/app
    depends_on:
      - mysql
    environment:
      - APP_ENV=local

  mysql:
    image: mysql:8.4                  # 8.0 は 2026年4月 EOL のため 8.4 LTS を使用
    command: --default-time-zone=+09:00   # サーバ既定 TZ を JST に（名前指定は tz テーブル要のため数値オフセット）
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ses_matching
      MYSQL_ROOT_PASSWORD: secret
      TZ: Asia/Tokyo                  # コンテナ OS の TZ も JST に揃える
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
