services:
  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "5173:5173"                   # Vite 開発サーバー
    volumes:
      - ./laravel:/var/www
    depends_on:
      - mysql
      - minio
    environment:
      - APP_ENV=local

  python:
    build:
      context: ./python
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    volumes:
      - ./python:/app
    environment:
      - APP_ENV=local

  mysql:
    image: mysql:8.4                  # 8.0 は 2026年4月 EOL のため 8.4 LTS を使用
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ses_matching
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z  # バージョン固定
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
