name: Python Tests

# マッチングエンジンのテストを CI で実行する。
# 現状このリポジトリにはデプロイ用ワークフローしか無く、PR の Checks が 0 件のため、
# ローカルでの pytest 実行が唯一のゲートになっている。

on:
  push:
    branches: [develop, main]
    paths:
      - 'python/**'
      - '.github/workflows/test-python.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'python/**'
      - '.github/workflows/test-python.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 本番コンテナ（python/Dockerfile の python:3.12-slim）に合わせる
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # pytest-cov は CI でのみ使うため requirements.txt には入れない
          # （本番イメージに不要な依存を持ち込まない）
          pip install pytest-cov

      - name: Run pytest
        env:
          PYTHONPATH: .
          # boto3 が認証情報を探して IMDS に問い合わせに行かないようにする。
          # テストは Bedrock / SSM をすべてモックしており AWS へは接続しない。
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: ap-northeast-1
        run: |
          pytest tests/ -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=90
