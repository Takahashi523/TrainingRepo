# 前段 Nginx（リバースプロキシ）設定
# 配置先: <リポジトリ>/nginx-proxy/default.conf
# コンテナ: nginx:1.27-alpine（docker-compose.prod.yml の nginx サービス）

# 未知の Host / IP 直打ちを受け止める catch-all（Issue #90 #6）。
# これが無いと、想定外の Host のリクエストが最初の server ブロックに流れ込む。
# 444 は「応答せず接続を閉じる」nginx 独自コード。
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # SNI が一致しない／SNI を送らない接続は TLS 層で拒否する（nginx 1.19.4+）。
    # このブロックはハンドシェイクを完了させないため証明書を持つ必要がなく、
    # 持たせないことでホスト名変更・lineage 改番時に更新する箇所を1つ減らせる。
    ssl_reject_handshake on;

    # SNI は正規だが Host ヘッダーが一致しないリクエスト、
    # および HTTP:80 の不明な Host は、TLS 確立後にここへ落ちて 444 になる。
    return 444;
}

server {
    listen 80;
    server_name 54-168-196-65.nip.io;

    # ACME(webroot) 用。証明書更新のリクエストだけは HTTPS へ飛ばさず、
    # certbot が置いた認証ファイルを直接返す（Issue #90 #3）。
    # location / より前に置くこと。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;                       # nginx 1.25.1 以降の記法（Issue #90 #6）
    server_name 54-168-196-65.nip.io;

    ssl_certificate     /etc/letsencrypt/live/54-168-196-65.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54-168-196-65.nip.io/privkey.pem;

    # --- TLS 設定（Issue #90 #6）-------------------------------------------
    # 既定のままだと TLS 1.0/1.1 が有効になり得るため明示的に絞る。
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLS1.3 ではクライアント優先が推奨
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # --- セキュリティヘッダー ----------------------------------------------
    # nginx のバージョンを応答ヘッダー・エラーページに出さない
    server_tokens off;

    # HSTS。max-age の期間はブラウザが HTTPS を強制し続けるため、
    # 導入直後は短め（下記 300 秒）で挙動を確認し、問題なければ 31536000（1年）へ上げること。
    # includeSubDomains / preload は nip.io のような共有ドメインでは付けない。
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # CSV アップロード上限（アプリ側 5MB・PHP 側 post_max_size=10M と揃える）
    client_max_body_size 10M;

    # ACME(webroot)。80 番だけでなく 443 側にも置いておくと、
    # リダイレクト後に来た場合でも認証が通る。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://laravel:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 処理（E1 マッチング・E2 要約）は Laravel 側が最大 30 秒待つ。
        # nginx の既定 60 秒でも足りるが、Laravel のタイムアウトより先に
        # nginx が切ると 504 の原因が切り分けづらくなるため明示的に長めに取る。
        proxy_connect_timeout 10s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
    }
}
